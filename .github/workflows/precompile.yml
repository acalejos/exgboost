name: Native packages
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MIX_ENV: prod
      EXGBOOST_BUILD: 'true'
      BUILD_JOBS: '2'
      ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache/precompiled
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '26.2'
          elixir-version: '1.17.3'
      - name: Install build tools
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y cmake build-essential
          else
            brew install libomp
          fi
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
            cache/xgboost
          key: native-${{ matrix.target }}-${{ hashFiles('mix.lock', 'Makefile', 'c/**', 'scripts/bundle_macos.sh') }}
          restore-keys: native-${{ matrix.target }}-
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Test the source build
        run: MIX_ENV=test mix test
      - name: Build archive
        run: mix elixir_make.precompile
      - name: Verify architecture and shared libraries
        run: bash scripts/verify_archive.sh cache/precompiled/*.tar.gz '${{ matrix.target }}'
      - name: Load archive in a fresh BEAM and compare predictions
        run: bash scripts/smoke_archive.sh cache/precompiled/*.tar.gz
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: |
            cache/precompiled/*.tar.gz
            cache/precompiled/*.sha256
          if-no-files-found: error
  package:
    needs: [build, quality]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '26.2'
          elixir-version: '1.17.3'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - run: elixir scripts/release_checksums.exs release
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Build Hex package with the complete checksum manifest
        run: mix hex.build
      - run: cp exgboost-*.tar checksum.exs release/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: hex-package
          path: |
            release/exgboost-*.tar
            release/checksum.exs
            release/SHA256SUMS
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release_tag.py "$RELEASE_TAG"
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.sha256
            release/exgboost-*.tar
            release/checksum.exs
            release/SHA256SUMS
